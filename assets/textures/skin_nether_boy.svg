  <rect x="41" y="49" width="1" height="1" fill="#FF4500"/>
  <rect x="40" y="50" width="4" height="1" fill="#A01010"/>
  <!-- Right arm overlay (cols 44-47) -->
  <rect x="44" y="48" width="4" height="2" fill="#8B0000"/>
  <rect x="46" y="49" width="1" height="1" fill="#FF4500"/>
  <rect x="44" y="50" width="4" height="1" fill="#A01010"/>

  <!-- ==================== RIGHT LEG (cols 4-7, rows 20-27) ==================== -->
  <!-- Dark tactical pants -->
  <rect x="4" y="20" width="4" height="1" fill="#2A2A2A"/>
  <rect x="4" y="21" width="4" height="1" fill="#333333"/>
  <rect x="4" y="22" width="4" height="1" fill="#2A2A2A"/>
  <rect x="4" y="23" width="4" height="1" fill="#333333"/>
  <!-- tactical pocket/strap -->
  <rect x="4" y="24" width="1" height="1" fill="#3D3D3D"/>
  <rect x="4" y="25" width="4" height="1" fill="#2A2A2A"/>
  <rect x="4" y="26" width="4" height="1" fill="#333333"/>
  <!-- Combat boot, rows 26-27 -->
  <rect x="4" y="27" width="4" height="1" fill="#1A1A1A"/>
  <!-- boot accent -->
  <rect x="4" y="27" width="1" height="1" fill="#2A2A2A"/>

  <!-- ==================== LEFT LEG (cols 20-23, rows 20-27) ==================== -->
  <rect x="20" y="20" width="4" height="1" fill="#2A2A2A"/>
  <rect x="20" y="21" width="4" height="1" fill="#333333"/>
  <rect x="20" y="22" width="4" height="1" fill="#2A2A2A"/>
  <rect x="20" y="23" width="4" height="1" fill="#333333"/>
  <!-- tactical pocket -->
  <rect x="23" y="24" width="1" height="1" fill="#3D3D3D"/>
  <rect x="20" y="25" width="4" height="1" fill="#2A2A2A"/>
  <rect x="20" y="26" width="4" height="1" fill="#333333"/>
  <!-- Combat boot -->
  <rect x="20" y="27" width="4" height="1" fill="#1A1A1A"/>
  <rect x="23" y="27" width="1" height="1" fill="#2A2A2A"/>

