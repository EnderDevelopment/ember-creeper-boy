  <rect x="44" y="24" width="4" height="1" fill="#E8B890"/>
  <rect x="44" y="25" width="4" height="1" fill="#D4A070"/>
  <rect x="44" y="26" width="4" height="1" fill="#E8B890"/>
  <rect x="44" y="27" width="4" height="1" fill="#D4A070"/>

