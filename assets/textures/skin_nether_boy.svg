  <rect x="36" y="22" width="4" height="1" fill="#B22222"/>
  <rect x="36" y="22" width="1" height="1" fill="#FF4500"/>
  <rect x="36" y="23" width="4" height="1" fill="#A01010"/>

  <!-- Left hand (skin) -->
  <rect x="36" y="24" width="4" height="1" fill="#E8B890"/>
  <rect x="36" y="25" width="4" height="1" fill="#D4A070"/>
  <rect x="36" y="26" width="4" height="1" fill="#E8B890"/>
  <rect x="36" y="27" width="4" height="1" fill="#D4A070"/>

  <!-- ==================== ARM OVERLAY (sleeves) rows 48-55 ===================== -->
  <!-- Left arm overlay (cols 40-43) -->
